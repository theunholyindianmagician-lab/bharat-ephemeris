<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#070c18"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffb800"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80effe"/>
      <stop offset="100%" stop-color="#00d8f6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad)" stroke="#1a2642" stroke-width="4"/>

  <!-- Celestial Grid Rings -->
  <circle cx="96" cy="96" r="74" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="96" cy="96" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="96" cy="96" r="32" fill="none" stroke="#00d8f6" stroke-width="1" opacity="0.5"/>

  <!-- Orbit Crosshairs -->
  <line x1="96" y1="14" x2="96" y2="178" stroke="#1a2642" stroke-width="1.5"/>
  <line x1="14" y1="96" x2="178" y2="96" stroke="#1a2642" stroke-width="1.5"/>

  <!-- Central Star / Sun Symbol -->
  <polygon points="96,68 102,90 124,96 102,102 96,124 90,102 68,96 90,90" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="8" fill="#ffffff"/>

  <!-- Planetary Nodes -->
  <circle cx="150" cy="96" r="7" fill="#00d8f6" filter="url(#glow)"/>
  <circle cx="96" cy="42" r="5" fill="#ff3d00"/>
  <circle cx="48" cy="116" r="6" fill="#00e676"/>
</svg>
